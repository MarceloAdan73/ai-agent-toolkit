name: Bug report
description: Report a bug so we can fix it
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Before opening, check if a similar issue already exists.
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of the toolkit is affected?
      options:
        - ai-toolkit CLI (toolkit/)
        - agent-doc-generator
        - agent-test-generator
        - agent-refactor
        - agent-code-review
        - agent-security-audit
        - npm package / installation
        - Documentation
      default: 0
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Version of the toolkit (run `ai-toolkit --version`)
      placeholder: "0.1.0"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen, and what actually happened?
      placeholder: "I ran `ai-toolkit doc --path ./src` and..."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the issue
      placeholder: |
        1. Run `npx ai-toolkit doc --path ./src`
        2. Pass `--provider ollama`
        3. See error
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows
        - macOS
        - Linux
      default: 0
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: Output of `node --version`
      placeholder: "v22.14.0"
  - type: textarea
    id: logs
    attributes:
      label: Relevant output / logs
      description: Paste any error messages or logs. Remove any sensitive data.
      render: shell
