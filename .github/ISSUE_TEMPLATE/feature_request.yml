name: Feature request
description: Suggest an idea for the toolkit
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement! Help us understand the problem you're solving.
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      description: What area does this affect?
      options:
        - New provider support
        - New agent / command
        - Existing agent improvement
        - CLI / UX improvement
        - Performance
        - Documentation
        - Other
      default: 0
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve? Keep it user-focused.
      placeholder: "I'm trying to..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should this work? Feel free to sketch the UX.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What else did you try or consider?
